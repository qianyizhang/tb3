<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WSI 实物课堂 · 四种参考标注，四种任务</title>
    <style>
      :root {
        --ink: #142a30;
        --muted: #637478;
        --line: #d8e3df;
        --green: #15645b;
        --paper: #f6f8f4;
        --card: #fff;
        --accent: #d7eee3;
        --text-label: 13px;
        --text-secondary: 14px;
        --text-reading: 15px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.65 -apple-system,
          BlinkMacSystemFont,
          'PingFang SC',
          'Noto Sans CJK SC',
          sans-serif;
      }
      a {
        color: #0d6f65;
      }
      button,
      select,
      input {
        font: inherit;
      }
      button,
      select {
        border: 1px solid var(--line);
        background: white;
        border-radius: 9px;
        padding: 9px 13px;
        color: var(--ink);
        cursor: pointer;
      }
      button:hover {
        background: #e9f4ee;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 3px solid #f0ac45;
        outline-offset: 3px;
      }
      button[aria-pressed='true'],
      button.active {
        background: var(--green);
        color: white;
        border-color: var(--green);
      }
      header {
        max-width: 1400px;
        margin: auto;
        padding: 42px 36px 24px;
      }
      .eyebrow {
        font-size: var(--text-label);
        letter-spacing: 0.13em;
        font-weight: 700;
        color: var(--green);
      }
      h1 {
        font-size: clamp(30px, 4vw, 50px);
        line-height: 1.2;
        letter-spacing: -0.03em;
        margin: 10px 0 16px;
      }
      header p {
        max-width: 950px;
        margin: 0;
        color: var(--muted);
      }
      .language-switch {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
        font-size: var(--text-reading);
      }
      .language-switch select {
        width: auto;
        min-height: 44px;
        font-size: var(--text-reading);
      }
      .reading-boundary {
        max-width: 1328px;
        margin: 0 auto 20px;
        padding: 15px 18px;
        border-left: 4px solid var(--green);
        background: #eaf0e9;
        border-radius: 0 9px 9px 0;
        font-size: var(--text-reading);
      }
      .reading-boundary p { margin: 3px 0 0; }
      .pills {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .pill {
        font-size: var(--text-secondary);
        border: 1px solid var(--line);
        padding: 4px 11px;
        border-radius: 30px;
        background: white;
      }
      nav {
        max-width: 1328px;
        margin: 4px auto 22px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 0 0;
      }
      nav button {
        text-align: left;
        padding: 15px 18px;
        font-weight: 600;
      }
      nav small {
        display: block;
        font-weight: 400;
        opacity: 0.85;
        font-size: var(--text-label);
      }
      main {
        max-width: 1400px;
        margin: auto;
        padding: 0 36px 42px;
      }
      h2 {
        font-size: 27px;
        line-height: 1.35;
        margin: 0 0 10px;
      }
      .intro {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .intro p {
        max-width: 980px;
        margin: 0;
        font-size: var(--text-reading);
      }
      .badge {
        flex-shrink: 0;
        background: #fff2d9;
        color: #775318;
        font-size: var(--text-label);
        border-radius: 6px;
        padding: 4px 9px;
      }
      .workbench {
        display: grid;
        grid-template-columns: minmax(0, 2.25fr) minmax(270px, 1fr);
        gap: 20px;
      }
      .viewer,
      .card,
      .comparison,
      details {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 15px;
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        padding: 14px;
        background: #fff;
      }
      .toolbar label {
        font-size: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      select {
        max-width: 100%;
        font-size: var(--text-secondary);
      }
      .viewport {
        height: 520px;
        overflow: auto;
        background: #e9eeeb;
        padding: 12px;
        position: relative;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .stage {
        position: relative;
        margin: auto;
        flex-shrink: 0;
        background: white;
        box-shadow: 0 2px 12px #18302810;
      }
      .stage img[hidden] {
        display: none;
      }
      .stage img {
        display: block;
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        pointer-events: none;
      }
      .scale {
        position: absolute;
        bottom: 10px;
        left: 12px;
        color: #fff;
        text-shadow: 0 1px 4px #000;
        background: #162b31cc;
        padding: 4px 8px;
        font-size: var(--text-label);
        border-radius: 4px;
      }
      .scale i {
        display: block;
        height: 3px;
        background: white;
        margin-bottom: 3px;
      }
      .view-footer {
        padding: 12px 16px;
        font-size: var(--text-reading);
        color: var(--muted);
      }
      .view-footer p {
        margin: 3px 0;
      }
      .legend {
        display: flex;
        gap: 6px 13px;
        flex-wrap: wrap;
        font-size: var(--text-reading);
        padding: 0 15px 12px;
      }
      .swatch {
        display: inline-block;
        width: 11px;
        height: 11px;
        border: 1px solid #0003;
        margin-right: 4px;
      }
      .legend[hidden],
      .layers[hidden] {
        display: none;
      }
      .layers {
        padding: 0 15px 9px;
        font-size: var(--text-reading);
        display: flex;
        gap: 14px;
      }
      .card {
        padding: 20px;
      }
      .card h3,
      .steps h3 {
        font-size: 17px;
        line-height: 1.4;
        margin: 0 0 10px;
      }
      .card p {
        font-size: var(--text-reading);
        margin: 8px 0;
      }
      .card ul,
      .body ul {
        margin: 8px 0;
        padding-left: 18px;
      }
      .card li,
      .body li {
        font-size: var(--text-reading);
        margin: 6px 0;
      }
      .card li p,
      .body li p {
        margin: 0;
      }
      .stats-table {
        min-width: 340px;
      }
      .body:has(.stats-table) {
        overflow-x: auto;
      }
      .read-steps {
        padding: 0;
        list-style: none;
        counter-reset: steps;
      }
      .read-steps li {
        counter-increment: steps;
        font-size: var(--text-reading);
        margin: 14px 0;
        padding-left: 30px;
        position: relative;
      }
      .read-steps li:before {
        content: counter(steps);
        position: absolute;
        left: 0;
        top: 0;
        background: var(--accent);
        color: var(--green);
        width: 22px;
        height: 22px;
        border-radius: 50%;
        text-align: center;
        font-size: var(--text-label);
        font-weight: 700;
      }
      .small {
        font-size: var(--text-reading);
        color: var(--muted);
      }
      .mini {
        width: 150px;
        float: right;
        margin: 8px 0 8px 12px;
        border: 1px solid var(--line);
      }
      .insight {
        margin-top: 15px;
        background: #eef6f0;
        border-radius: 8px;
        padding: 12px;
        font-size: var(--text-reading);
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-top: 22px;
      }
      .steps .card p {
        font-size: var(--text-reading);
      }
      .stepno {
        color: var(--green);
        font-size: var(--text-label);
        font-weight: 700;
        display: block;
        margin-bottom: 8px;
      }
      .details-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 18px 0;
      }
      details {
        padding: 0 18px;
      }
      summary {
        cursor: pointer;
        padding: 15px 0;
        font-weight: 600;
        font-size: var(--text-reading);
      }
      details .body {
        padding-bottom: 15px;
        font-size: var(--text-reading);
        overflow-wrap: anywhere;
      }
      details p {
        margin: 8px 0;
      }
      code {
        font-family: ui-monospace, monospace;
        font-size: var(--text-label);
        background: #eff3f0;
        padding: 2px 4px;
        border-radius: 3px;
        overflow-wrap: anywhere;
      }
      .comparison {
        margin-top: 30px;
        padding: 23px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: var(--text-reading);
      }
      .comparison table {
        min-width: 650px;
      }
      th,
      td {
        text-align: left;
        padding: 11px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        font-size: var(--text-label);
        color: var(--muted);
      }
      .table-scroll {
        overflow-x: auto;
      }
      .recommendations {
        font-size: var(--text-reading);
        margin: 8px 0 0;
        padding-left: 22px;
      }
      .copy-meta { margin: 12px 0; min-height: 44px; }
      .recommendations li,
      .footnote li {
        margin: 6px 0;
      }
      .footnote {
        font-size: var(--text-label);
        color: var(--muted);
        padding: 17px 0 17px 20px;
        max-width: 1100px;
      }
      strong {
        font-weight: 650;
      }
      .metric {
        font-size: 22px;
        font-weight: 650;
        color: var(--green);
      }
      .stats-table {
        font-size: var(--text-label);
      }
      .stats-table td {
        padding: 5px 7px;
      }
      .caption-status {
        color: var(--green);
        font-weight: 600;
      }
      .note {
        border-left: 3px solid #d6a13b;
        padding-left: 10px;
      }
      .disclaimer {
        display: block;
        margin-top: 15px;
        font-size: var(--text-label);
        color: var(--muted);
      }
      @media (max-width: 900px) {
        header,
        main {
          padding-left: 18px;
          padding-right: 18px;
        }
        nav {
          margin: 0 18px 22px;
          grid-template-columns: 1fr 1fr;
        }
        .workbench {
          grid-template-columns: 1fr;
        }
        .steps {
          grid-template-columns: 1fr;
        }
        .details-grid {
          grid-template-columns: 1fr;
        }
        .viewport {
          height: 440px;
        }
        h2 {
          font-size: 24px;
        }
      }
      @media (max-width: 500px) {
        .toolbar {
          padding: 10px;
        }
        .viewport {
          height: 365px;
        }
        .intro {
          display: block;
        }
        .badge {
          display: inline-block;
          margin-top: 10px;
        }
        nav button {
          padding: 10px;
          font-size: var(--text-reading);
        }
        .comparison {
          padding: 15px;
        }
        header {
          padding-top: 26px;
        }
        select {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow" data-i18n="eyebrow">全片图像阅读指南 · 原图与来源标注</div>
      <h1 data-i18n="hero">先看图，再看答案。</h1>
      <p data-i18n="intro">四套真实样本：看原图 → 揭示参考标注 → 理解任务。</p>
      <label class="language-switch"><span data-i18n="language">语言</span>
        <select id="language" aria-label="语言"><option value="en">English</option><option value="zh-CN">中文</option></select>
      </label>
    </header>
    <nav id="tabs" aria-label="选择数据集"></nav>
    <main>
      <aside class="reading-boundary" aria-label="阅读边界">
        <strong data-i18n="boundaryHeading">阅读边界</strong>
        <p id="boundary"></p>
      </aside>
      <section class="intro">
        <div>
          <h2 id="title"></h2>
          <div id="goal"></div>
        </div>
        <span class="badge" data-i18n="proposed">拟议任务／教学示例</span>
      </section>
      <section class="workbench">
        <div class="viewer">
          <div class="toolbar">
            <select id="view" aria-label="图像视图"></select
            ><button id="reveal" aria-pressed="false">显示参考标注</button
            ><label
              ><span data-i18n="zoom">放大</span>
              <input
                id="zoom"
                aria-label="图像放大倍数"
                type="range"
                min="1"
                max="4"
                step=".25"
                value="1"
                style="width: 85px" /></label
            ><button id="reset" data-i18n="reset">复位</button>
          </div>
          <div class="layers" id="layers" hidden>
            <label><input type="checkbox" id="tissue" checked /><span data-i18n="tissue">组织区域</span></label
            ><label><input type="checkbox" id="cells" checked /><span data-i18n="cells">细胞框</span></label>
          </div>
          <div class="viewport" id="viewport">
            <div class="stage" id="stage">
              <img id="raw" alt="原始病理图像" /><img
                id="overlay"
                alt="来源 GT 叠加层"
                hidden
              /><img id="overlay2" alt="来源细胞 GT 叠加层" hidden />
              <div class="scale"><i id="scalebar"></i><span id="scalelabel"></span></div>
            </div>
          </div>
          <div class="view-footer">
            <p><span class="caption-status" id="status">当前：仅原图</span></p>
            <p id="caption"></p>
            <p id="coordinates"></p>
          </div>
          <div id="legend" class="legend" hidden></div>
        </div>
        <aside class="card">
          <div class="eyebrow" data-i18n="howToRead">阅读提示</div>
          <h3 style="margin-top: 8px" data-i18n="readingHeading">看这张图时，注意什么？</h3>
          <ol class="read-steps" id="reading"></ol>
          <div id="minimap"></div>
          <div class="insight" id="insight"></div>
          <div class="small" id="scale-note" style="margin-top: 14px"></div>
        </aside>
      </section>
      <section class="steps">
        <article class="card">
          <span class="stepno" data-i18n="stepData">01 · 输入</span>
          <h3 data-i18n="dataHeading">你实际拿到什么</h3>
          <div id="data"></div>
        </article>
        <article class="card">
          <span class="stepno" data-i18n="stepReference">02 · 参考标注</span>
          <h3 data-i18n="referenceHeading">参考标注了什么</h3>
          <div id="gt"></div>
        </article>
        <article class="card">
          <span class="stepno" data-i18n="stepTask">03 · 任务</span>
          <h3 data-i18n="taskHeading">让智能体完成什么</h3>
          <div id="task"></div>
        </article>
      </section>
      <section class="details-grid">
        <details>
          <summary data-i18n="outputSummary">输出文件与评分方式</summary>
          <div class="body">
            <h4 data-i18n="deliverable">具体交付物</h4>
            <div id="output"></div>
            <h4 data-i18n="evaluation">如何评价</h4>
            <div id="evaluation"></div>
          </div>
        </details>
        <details>
          <summary data-i18n="helpersSummary">帮助条件与参考边界</summary>
          <div class="body">
            <div id="helpers"></div>
            <div id="limits"></div>
          </div>
        </details>
        <details>
          <summary data-i18n="sourcesSummary">来源、授权与下载范围</summary>
          <div class="body">
            <div id="sources"></div>
            <div id="coverage"></div>
            <button id="copy-meta" class="copy-meta" data-i18n="copyMeta">复制完整元数据</button>
            <span id="copy-status" role="status" aria-live="polite"></span>
          </div>
        </details>
        <details>
          <summary data-i18n="numbersSummary">本例参考标注的可复核数值</summary>
          <div class="body">
            <p class="note" data-i18n="numbersNote">公开参考标注的衍生值，仅供教学。</p>
            <div id="numbers"></div>
          </div>
        </details>
      </section>
    </main>
    <script id="tour-data" type="application/json">
      "__DATA__"
    </script>
    <script id="tour-metadata" type="application/json">
      "__META__"
    </script>
    <script>
      const D = JSON.parse(document.getElementById('tour-data').textContent);
      const META = JSON.parse(document.getElementById('tour-metadata').textContent);
      const translations = {
        eyebrow: 'WSI FIELD GUIDE · REAL IMAGES, SOURCE ANNOTATIONS',
        hero: 'Look at the slide before revealing the answer.',
        intro: 'Four real samples: inspect the input → reveal the source reference → understand the task.',
        language: 'Language',
        boundaryHeading: 'Reading boundary',
        proposed: 'Proposed task / teaching example',
        zoom: 'Zoom',
        reset: 'Reset view',
        tissue: 'Tissue regions',
        cells: 'Cell boxes',
        howToRead: 'HOW TO READ',
        stepData: '01 · DATA',
        stepReference: '02 · SOURCE REFERENCE',
        stepTask: '03 · TASK',
        readingHeading: 'What should I notice?',
        dataHeading: 'What the agent receives',
        referenceHeading: 'What the reference marks',
        taskHeading: 'What the agent must do',
        outputSummary: 'Output and evaluation',
        deliverable: 'Deliverable',
        evaluation: 'Evaluation',
        helpersSummary: 'Assistance and reference limits',
        sourcesSummary: 'Sources, terms, and acquisition scope',
        copyMeta: 'Copy full metadata',
        numbersSummary: 'Checkable source-reference measurements',
        numbersNote: 'Derived from the released reference for teaching; not a model result.',
      };
      const originalText = Object.fromEntries(
        [...document.querySelectorAll('[data-i18n]')].map((node) => [node.dataset.i18n, node.textContent]),
      );
      const languageKey = 'tb3-presentation-language';
      function initialLanguage() {
        const query = new URLSearchParams(location.search).get('lang');
        if (query === 'en' || query === 'zh-CN') return query;
        try {
          const saved = localStorage.getItem(languageKey);
          if (saved === 'en' || saved === 'zh-CN') return saved;
        } catch { /* Local files can disable storage. */ }
        return navigator.language.toLowerCase().startsWith('zh') ? 'zh-CN' : 'en';
      }
      let language = initialLanguage();
      let ds = 'camelyon',
        vi = 0,
        revealed = false;
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      const copy = (dataset) => language === 'en' ? dataset.locales.en : dataset;
      const phrase = (en, zh) => language === 'en' ? en : zh;
      function renderStatic() {
        document.documentElement.lang = language;
        document.title = phrase('WSI field guide · Four references, four tasks', 'WSI 实物课堂 · 四种参考标注，四种任务');
        $('language').value = language;
        $('language').setAttribute('aria-label', phrase('Language', '语言'));
        $('tabs').setAttribute('aria-label', phrase('Select a dataset', '选择数据集'));
        document.querySelector('.reading-boundary').setAttribute('aria-label', phrase('Reading boundary', '阅读边界'));
        $('view').setAttribute('aria-label', phrase('Image view', '图像视图'));
        $('zoom').setAttribute('aria-label', phrase('Image zoom', '图像放大倍数'));
        $('raw').alt = phrase('Source pathology image', '原始病理图像');
        $('overlay').alt = phrase('Source reference overlay', '来源参考标注叠加层');
        $('overlay2').alt = phrase('Source cell-reference overlay', '来源细胞参考标注叠加层');
        document.querySelectorAll('[data-i18n]').forEach((node) => {
          const key = node.dataset.i18n;
          node.textContent = language === 'en' ? translations[key] : originalText[key];
        });
        $('tabs').innerHTML = Object.entries(D)
          .map(([key, data], index) => `<button data-key="${key}" aria-pressed="false">0${index + 1} · ${data.short}<small>${esc(copy(data).tagline)}</small></button>`)
          .join('');
        document.querySelectorAll('#tabs button').forEach((button) => {
          button.onclick = () => chapter(button.dataset.key);
        });
      }
      function chapter(key) {
        ds = key;
        vi = 0;
        revealed = false;
        $('zoom').value = 1;
        const d = D[key], c = copy(d);
        document.querySelectorAll('nav button').forEach((b) => {
          b.classList.toggle('active', b.dataset.key === key);
          b.setAttribute('aria-pressed', String(b.dataset.key === key));
        });
        $('title').textContent = c.title;
        $('goal').innerHTML = c.sections.goal;
        $('boundary').textContent = c.caveat || phrase('Teaching sample; no model was run.', '教学样本；未运行模型。');
        for (const [id, k] of Object.entries({
          data: 'Given/Original data',
          gt: 'Given/Reference-only material',
          task: 'Task specification',
          output: 'Expected output',
          evaluation: 'Evaluation',
          helpers: 'Given/Supplied helpers',
          limits: 'Gaps',
          sources: 'Sources',
          coverage: 'Coverage',
        }))
          $(id).innerHTML = c.sections[k] || '';
        $('reading').innerHTML = c.reading.map((s) => '<li>' + esc(s) + '</li>').join('');
        $('view').innerHTML = d.views
          .map((v, i) => `<option value="${i}">${esc(language === 'en' ? c.viewLabels[i] : v.label)}</option>`)
          .join('');
        $('scale-note').textContent = c.scaleNote;
        $('numbers').innerHTML = c.numbers;
        changeView();
      }
      function changeView() {
        const d = D[ds], c = copy(d),
          v = d.views[vi];
        revealed = false;
        $('zoom').value = 1;
        $('tissue').checked = $('cells').checked = true;
        $('raw').src = v.input;
        $('caption').textContent = vi === 0 ? c.overviewCaption : language === 'en' ? c.selection : v.selection || d.detailCaption;
        $('coordinates').textContent = v.crop_level0
          ? phrase('Level-0 crop origin (', '全片左上角 (') +
            v.crop_level0.slice(0, 2).join(', ') +
            ') · ' +
            v.crop_level0[2] +
            ' × ' +
            v.crop_level0[3] +
            phrase(' source pixels', ' 原生像素')
          : v.source_roi
            ? phrase('Official ROI: ', '官方 ROI：') + v.source_roi
            : phrase('Thumbnail view; complete source image retained', '缩略图显示；完整原始文件已保留');
        $('insight').textContent = c.insight[vi > 0 ? 1 : 0];
        $('minimap').innerHTML = '';
        if (vi > 0) {
          let b = v.crop_level0;
          if (v.source_roi) {
            const q = v.source_roi
              .match(/\[(.*?)\]/)[1]
              .split(',')
              .map(Number);
            b = [q[0], q[1], q[2] - q[0], q[3] - q[1]];
          }
          if (b) {
            const o = d.views[0],
              down = o.downsample;
            $('minimap').innerHTML =
              `<svg class="mini" role="img" aria-label="${phrase('Blue box marks the teaching crop', '蓝框标出教学裁图')}" viewBox="0 0 ${o.width} ${o.height}"><image href="${o.input}" width="${o.width}" height="${o.height}"/><rect x="${b[0] / down}" y="${b[1] / down}" width="${b[2] / down}" height="${b[3] / down}" stroke="#0674d8" fill="none" stroke-width="5"/></svg><p class="small">${phrase('Blue box: location of this teaching crop.', '蓝框：当前教学裁图的位置。')}</p>`;
          }
        }
        updateLayers();
        fit();
        $('viewport').scrollTo(0, 0);
      }
      function updateLayers() {
        const d = D[ds], c = copy(d),
          v = d.views[vi],
          tiger = ds === 'tiger' && vi > 0;
        $('reveal').textContent = revealed ? phrase('Hide reference', '隐藏参考标注') : phrase('Reveal reference', '显示参考标注');
        $('reveal').setAttribute('aria-pressed', String(revealed));
        $('status').textContent = revealed ? phrase('Source image + reference (not a model result)', '原图 + 来源参考标注（非模型输出）') : phrase('Source image only', '仅显示原图');
        $('overlay').src = tiger ? v.tissue : v.overlay;
        $('overlay2').src = tiger ? v.cells : v.overlay;
        $('overlay').hidden = !revealed || (tiger && !$('tissue').checked);
        $('overlay2').hidden = !revealed || !tiger || !$('cells').checked;
        $('layers').hidden = !tiger || !revealed;
        const legend = ds === 'tiger' && vi === 0 ? [['#f59e0b', phrase('ROIs with dense annotations', '有密集标注的 ROI')]] : c.legend;
        $('legend').innerHTML = legend
          .map(([c, n]) => `<span><i class="swatch" style="background:${c}"></i>${esc(n)}</span>`)
          .join('');
        $('legend').hidden = !revealed;
      }
      function fit() {
        const d = D[ds],
          v = d.views[vi],
          vp = $('viewport'),
          scale =
            Math.min((vp.clientWidth - 24) / v.width, (vp.clientHeight - 24) / v.height) *
            Number($('zoom').value);
        $('stage').style.width = v.width * scale + 'px';
        $('stage').style.height = v.height * scale + 'px';
        const umPerPixel = d.mpp * (v.downsample || 1);
        let um = vi === 0 ? 1000 : 100,
          px = (um / umPerPixel) * scale;
        $('scalebar').style.width = px + 'px';
        $('scalelabel').textContent = um >= 1000 ? um / 1000 + ' mm' : um + ' µm';
      }
      $('language').onchange = () => {
        const previousView = vi, previousReveal = revealed;
        language = $('language').value;
        const url = new URL(location.href);
        url.searchParams.set('lang', language);
        history.replaceState(history.state, '', url.href);
        try { localStorage.setItem(languageKey, language); } catch { /* URL preserves this choice. */ }
        renderStatic();
        chapter(ds);
        vi = previousView;
        changeView();
        revealed = previousReveal;
        updateLayers();
      };
      $('copy-meta').onclick = async () => {
        const value = JSON.stringify(META, null, 2) + '\n';
        try {
          if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(value);
          else throw new Error('Clipboard API unavailable');
          $('copy-status').textContent = phrase('Metadata copied', '已复制元数据');
        } catch {
          const field = document.createElement('textarea');
          field.value = value;
          document.body.append(field);
          field.select();
          const okay = document.execCommand('copy');
          field.remove();
          $('copy-status').textContent = okay ? phrase('Metadata copied', '已复制元数据') : phrase('Copy failed', '复制失败');
        }
      };
      $('view').onchange = (e) => {
        vi = Number(e.target.value);
        changeView();
      };
      $('reveal').onclick = () => {
        revealed = !revealed;
        updateLayers();
      };
      $('zoom').oninput = fit;
      $('reset').onclick = () => {
        $('zoom').value = 1;
        fit();
        $('viewport').scrollTo(0, 0);
      };
      $('tissue').onchange = $('cells').onchange = updateLayers;
      window.addEventListener('resize', fit);
      renderStatic();
      chapter('camelyon');
    </script>
  </body>
</html>
