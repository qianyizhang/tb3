[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tb3-medical"
version = "0.2.0"
description = "A local medical research workbench"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3", "tomli-w>=1.2,<2", "pyyaml>=6,<7"]

[project.optional-dependencies]
imaging = ["numpy>=2", "pillow>=11"]

[project.scripts]
med = "tb3_medical.cli:main"
tb3-workload = "tb3_medical.workload:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.24,<2",
  "mypy>=2.3.1,<3",
  "pre-commit>=4.3,<5",
  "ruff>=0.16.8,<0.17",
]

[tool.uv]
required-version = ">=0.11.8"

[tool.hatch.build.targets.wheel]
packages = ["src/tb3_medical"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "PIE", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/tb3_medical"]
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true

# Optional imaging/model libraries are provisioned in separate runtimes. Check
# our adapters without installing those runtimes or traversing vendor internals.
[[tool.mypy.overrides]]
module = ["numpy.*", "PIL.*", "cv2.*", "torch.*", "segment_anything.*", "tiny_vit_sam"]
ignore_missing_imports = true
follow_imports = "skip"
