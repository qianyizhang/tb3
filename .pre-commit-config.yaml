minimum_pre_commit_version: 4.3.0
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: artifact-policy
        name: artifact policy
        entry: uv run --locked --no-sync python -m tb3_medical.hygiene
        language: system
        pass_filenames: false
        always_run: true
      - id: doc-links
        name: maintained documentation links
        entry: uv run --locked --no-sync python -m tb3_medical.doc_links
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --no-sync ruff check
        language: system
        files: ^((src|tests)/.*|scripts/build_anatomy_assets)\.py$
        types: [python]
      - id: ruff-format-check
        name: ruff format check
        entry: uv run --locked --no-sync ruff format --check
        language: system
        files: ^((src|tests)/.*|scripts/build_anatomy_assets)\.py$
        types: [python]
      - id: mypy
        name: mypy entire source package
        entry: uv run --locked --no-sync mypy
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml|uv\.lock)$
      - id: actionlint
        name: actionlint
        entry: uv run --locked --no-sync actionlint
        language: system
        pass_filenames: false
        files: ^\.github/(actions|workflows)/.*\.ya?ml$
        types: [yaml]
