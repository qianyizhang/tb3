name: Portable presentation checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'presentation/**'
      - 'groups/**'
      - 'datasets/**'
      - 'configs/**'
      - 'workbench.toml'
      - 'docs/evidence/**'
      - 'docs/research-rounds/**'
      - 'exports/records/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'discussions/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'Makefile'
      - '.github/workflows/presentation.yml'
      - '.github/actions/**'
      - '.python-version'
  push:
    paths:
      - 'src/**'
      - 'presentation/**'
      - 'groups/**'
      - 'datasets/**'
      - 'configs/**'
      - 'workbench.toml'
      - 'docs/evidence/**'
      - 'docs/research-rounds/**'
      - 'exports/records/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'discussions/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'Makefile'
      - '.github/workflows/presentation.yml'
      - '.github/actions/**'
      - '.python-version'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: presentation-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Check portable navigation, sources and interaction
        run: make presentation-check
