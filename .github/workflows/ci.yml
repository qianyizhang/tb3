name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check shared contracts and evidence integrity
        if: matrix.python-version == '3.14'
        run: make test-critical PYTHON=.venv/bin/python
      - name: Validate repository and critical regressions
        if: matrix.python-version == '3.12'
        run: make ci-check PYTHON=.venv/bin/python
      - name: Smoke-test the wheel
        if: matrix.python-version == '3.12'
        run: make build-check PYTHON=.venv/bin/python
